name: Patched Node compatibility

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 2020-2021/API
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: npm ci
      - name: Check API syntax and server dependencies
        run: |
          node --check index.js
          node -e "require('express'); require('cors'); require('mosca'); require('protobufjs')"
